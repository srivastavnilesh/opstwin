services:
  postgres:
    image: postgres:16-alpine
    container_name: opstwin_postgres
    environment:
      POSTGRES_USER: opstwin
      POSTGRES_PASSWORD: opstwin_local
      POSTGRES_DB: opstwin_ops
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstwin -d opstwin_ops"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - opstwin_pg:/var/lib/postgresql/data

volumes:
  opstwin_pg: