services:
  postgres:
    image: postgres:16-alpine
    container_name: opstwin_pg_stack
    environment:
      POSTGRES_USER: opstwin
      POSTGRES_PASSWORD: opstwin_local
      POSTGRES_DB: opstwin_ops
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstwin -d opstwin_ops"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: src/platform/Dockerfile.api
    ports: ["8000:8000"]
    env_file: ../../.env
    volumes:
      - ../../data:/app/data
      - ../../mlflow.db:/app/mlflow.db
      - ../../mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s   # Increased to allow model load
    restart: unless-stopped